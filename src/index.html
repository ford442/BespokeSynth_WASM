<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>BespokeSynth WASM - Modular Synthesizer</title>
    <meta name="description" content="BespokeSynth WebAssembly - A modular synthesizer running in your browser">
</head>
<body>
    <div id="container">
        <header id="header">
            <h1>BespokeSynth WASM</h1>
            <span class="version">v1.0.0</span>
            <div class="controls">
                <button id="playBtn" class="btn btn-play">Play</button>
                <button id="stopBtn" class="btn btn-stop">Stop</button>
            </div>
        </header>
        <main id="canvas-container">
            <canvas id="canvas"></canvas>
            <!-- Hybrid DOM text overlay: absolutely-positioned labels sit above the
                 WebGPU canvas using system fonts for crisp, sub-pixel text rendering.
                 pointer-events: none keeps all mouse input flowing to the canvas.
                 Content is populated and updated by BespokeSynthApp in index.ts.  -->
            <div id="gui-overlay" aria-hidden="true" role="presentation"></div>
            <div id="status">
                <div class="status-header">Initializing BespokeSynth</div>
                <div class="status-subheader">Setting up WebGPU and audio...</div>
                <div class="progress-container">
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="progress-fill" style="width: 0%"></div>
                    </div>
                    <div class="progress-percentage" id="progress-text">0%</div>
                </div>
                <div class="init-steps" id="init-steps">
                    <!-- Steps will be dynamically added here -->
                </div>
            </div>
        </main>
        <footer id="footer">
            <div class="info">
                WebGPU-accelerated modular synthesizer | Licensed under GPL-3.0
            </div>
        </footer>
    </div>
</body>
</html>
